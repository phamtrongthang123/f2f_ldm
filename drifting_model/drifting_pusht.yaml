_target_: diffusion_policy.workspace.train_drifting_workspace.TrainDriftingWorkspace
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score
dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true
dataset_obs_steps: 2
exp_name: default
horizon: 16
keypoint_visible_rate: 1.0
logging:
  group: null
  id: null
  mode: online
  name: train_drifting_pusht_lowdim
  project: drifting_policy_debug
  resume: true
  tags:
  - train_drifting
  - pusht_lowdim
  - default
multi_run:
  run_dir: data/outputs/train_drifting_pusht_lowdim
  wandb_name_base: train_drifting_pusht_lowdim
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
name: train_drifting
obs_as_global_cond: true
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06
past_action_visible: false
policy:
  _target_: models.policy.DriftingPolicy
  action_dim: 2
  obs_dim: 4  # 2 for agent_pos + ? (Depends on lowdim obs) - PushT lowdim is usually 20 (2 agent + 2 block pos + angle + ...) or similar.
  # But here we use 'shape_meta' to infer usually. For DriftingPolicy class, we pass explicit dims.
  # From train_robotics.py, obs_dim is calculated from dataset.
  # We'll use placeholders or typical values. PushT LowDim obs is typically 20.
  horizon: 16
  embed_dim: 256
  depth: 6
  num_heads: 8
  
  # Drifting specific
  temperatures: [0.02, 0.05, 0.2]

shape_meta:
  action:
    shape:
    - 2
  obs:
    obs:
      shape:
      - 20
      type: low_dim
task:
  dataset:
    _target_: diffusion_policy.dataset.pusht_dataset.PushTLowdimDataset
    horizon: 16
    max_train_episodes: 90
    pad_after: 7
    pad_before: 1
    seed: 42
    val_ratio: 0.02
    zarr_path: data/pusht/pusht_cchi_v7_replay.zarr
  env_runner:
    _target_: diffusion_policy.env_runner.pusht_keypoints_runner.PushTKeypointsRunner
    fps: 10
    max_steps: 300
    n_action_steps: 8
    n_envs: null
    n_obs_steps: 2
    n_test: 50
    n_test_vis: 4
    n_train: 6
    n_train_vis: 2
    past_action: false
    test_start_seed: 100000
    train_start_seed: 0
  keypoint_dim: 2
  name: pusht_lowdim
  shape_meta:
    action:
      shape:
      - 2
    obs:
      obs:
        shape:
        - 20
        type: low_dim
task_name: pusht_lowdim
training:
  checkpoint_every: 50
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 3050
  resume: true
  rollout_every: 50
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
val_dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false
