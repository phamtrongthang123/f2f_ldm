# Ablation default configuration (Table 7 of paper)
# ImageNet 256x256, latent-space generation

# Generator
generator:
  arch: DiT-B/2
  hidden_dim: 768
  depth: 12
  num_heads: 12
  patch_size: 2
  input_channels: 4
  input_size: 32
  num_register_tokens: 16
  num_style_tokens: 32
  style_codebook_size: 64
  num_classes: 1000

# Feature encoder
feature_encoder:
  type: latent_mae
  checkpoint_path: ./checkpoints/mae/mae_final.pt
  base_width: 256

# Drifting loss
drifting:
  temperatures: [0.02, 0.05, 0.2]
  n_classes: 64
  n_pos: 64
  n_neg: 64
  n_uncond: 16
  cfg_alpha_range: [1.0, 4.0]
  cfg_alpha_power: -3

# Optimizer
optimizer:
  type: AdamW
  lr: 2.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 5000
  grad_clip: 2.0

# Training
training:
  total_steps: 30000
  ema_decay: 0.999
  checkpoint_every: 5000
  log_every: 100

# Sample queue
queue:
  class_queue_size: 128
  uncond_queue_size: 1000
  push_per_step: 64

# VAE
vae:
  model_id: stabilityai/sd-vae-ft-mse
